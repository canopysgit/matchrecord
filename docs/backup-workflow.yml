# 需要在 GitHub 网页上新建 .github/workflows/backup.yml 并粘贴本文件内容（当前 token 没有 workflow 权限，无法直接推送）
name: weekly-backup
# 每周一 03:00 (北京时间) 把全部比赛数据导出成 JSON，提交到 data-backup 分支
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-backup
      - name: export
        run: |
          curl -fsS https://clmsg.xiaochaai.com/api/backup -o backup.json
          python3 -c "import json;d=json.load(open('backup.json'));print({k:len(v) for k,v in d.items() if isinstance(v,list)})"
      - name: commit
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backup.json
          git diff --cached --quiet || git commit -m "backup $(date -u +%F)"
          git push
